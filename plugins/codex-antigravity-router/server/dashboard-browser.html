<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Antigravity Router</title>
<style>
:root{color-scheme:light dark;font:15px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:24px;background:Canvas;color:CanvasText}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.muted{opacity:.72}.card{border:1px solid color-mix(in srgb,currentColor 20%,transparent);border-radius:14px;padding:20px;margin:16px 0}.row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,260px);gap:16px;align-items:center;margin:14px 0}label{font-weight:650}input,select,button{font:inherit;border:1px solid color-mix(in srgb,currentColor 28%,transparent);border-radius:9px;padding:10px 12px;background:Canvas;color:CanvasText}input[type=number]{width:100%}select{width:100%}option{background:Canvas;color:CanvasText}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.primary{background:#2563eb;border-color:#2563eb;color:white}.toggle{display:flex;align-items:center;justify-content:flex-end;gap:10px}.toggle input{width:18px;height:18px;accent-color:#2563eb}.agent{padding:13px 0;border-top:1px solid color-mix(in srgb,currentColor 16%,transparent)}.agent-title{font-weight:650}.status{font-size:13px;opacity:.75}.badge{display:inline-block;border-radius:20px;padding:2px 9px;margin-left:7px;background:color-mix(in srgb,#2563eb 18%,transparent);font-size:12px}.live{background:color-mix(in srgb,#16a34a 22%,transparent)}.error{color:#dc2626}.success{color:#15803d}.statusline{min-height:1.5em}.actions{display:flex;align-items:center;gap:14px}.empty{padding:14px 0}.subhead{display:flex;justify-content:space-between;align-items:center}.connection{font-size:12px}.connection:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-right:7px}
@media(max-width:600px){body{padding:14px}.card{padding:15px}.row{grid-template-columns:1fr;gap:7px}.toggle{justify-content:flex-start}.top{align-items:flex-start}}
</style><style>.notice{margin:10px 0 0}.notice-ready{color:#15803d}.notice-blocked{color:#b45309}</style></head>
<body><main class="wrap">
<header class="top"><div><strong>Antigravity Router <span class="muted">v1.0.12</span></strong><div class="muted">Delegation controls and agent activity</div></div><div><span class="connection" id="connection">Connecting</span> <button id="refresh">Refresh</button></div></header>
<section class="card" aria-labelledby="settingsHeading"><strong id="settingsHeading">Settings</strong>
<div class="row"><label for="enabled">Delegation</label><label class="toggle"><span id="enabledText">Enabled</span><input id="enabled" type="checkbox" checked></label></div>
<div class="row"><label for="maxWorkers">Maximum workers</label><input id="maxWorkers" type="number" min="1" max="32" step="1" value="4"></div>
<div class="row"><label for="model">Preferred Antigravity model</label><select id="model" aria-label="Preferred Antigravity model"><option value="">Loading models…</option></select></div>
<div class="actions"><button class="primary" id="save">Save settings</button><span class="statusline muted" id="message" role="status" aria-live="polite"></span></div></section>
<section class="card" aria-labelledby="verificationHeading"><strong id="verificationHeading">Verification readiness</strong><div id="verification" class="notice muted" role="status" aria-live="polite">Checking verification setup…</div></section>
<section class="card" aria-labelledby="agentsHeading"><div class="subhead"><strong id="agentsHeading">Agents</strong><span class="muted" id="agentCount">0</span></div><div id="agents" class="empty muted" aria-live="polite">Loading agent activity…</div><div class="status muted" id="updated"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.hash.slice(1));let token=params.get('token');try{token=token||sessionStorage.getItem('antigravityRouterToken');if(params.has('token'))sessionStorage.setItem('antigravityRouterToken',token)}catch{}history.replaceState(null,'',location.pathname+location.search);let loading=false;
async function api(path,options={}){const response=await fetch(path,{...options,headers:{authorization:`Bearer ${token}`,...options.headers}});let data;try{data=await response.json()}catch{throw new Error(`Dashboard request failed (${response.status}).`)}if(!response.ok)throw new Error(data.error||`Dashboard request failed (${response.status}).`);return data}
function render(data){const s=data.settings||{};$('enabled').checked=s.enabled!==false;$('enabledText').textContent=$('enabled').checked?'Enabled':'Off';$('maxWorkers').value=s.maxWorkers||4;const select=$('model'),selected=s.model||'';const models=[...new Set([selected,...(data.models||[])].filter(Boolean))];select.replaceChildren();if(!models.length){const option=document.createElement('option');option.value=selected;option.textContent=selected||'No models found';select.append(option)}else for(const value of models){const option=document.createElement('option');option.value=value;option.textContent=value;select.append(option)}select.value=selected;const verification=data.verification||{};const verificationNode=$('verification');verificationNode.textContent=verification.message||'Verification readiness is unavailable.';verificationNode.className=`notice ${verification.ready?'notice-ready':'notice-blocked'}`;const agents=data.agents||[];$('agentCount').textContent=String(agents.length);const list=$('agents');list.replaceChildren();if(!agents.length){list.textContent='No active or recent agents.'}else for(const agent of agents){const row=document.createElement('div');row.className='agent';const heading=document.createElement('div');heading.className='agent-title';heading.append(document.createTextNode(`${agent.name||'Worker'} · ${agent.task||'Task'}`));const badge=document.createElement('span');badge.className=`badge${agent.live?' live':''}`;badge.textContent=agent.live?'Working':String(agent.phase||'Recent').replaceAll('_',' ');heading.append(badge);const details=document.createElement('div');details.className='status';details.textContent=[agent.workspace,agent.model,agent.batchId ? 'Batch '+agent.batchId : null,agent.lastFileTool,Number.isInteger(agent.tokens) ? agent.tokens.toLocaleString()+' Antigravity tokens' : null].filter(Boolean).join(' · ');row.append(heading,details);list.append(row)}$('updated').textContent=data.updatedAt?`Updated ${new Date(data.updatedAt).toLocaleTimeString()}`:'';$('connection').textContent='Connected';$('connection').className='connection';}
async function refresh(){if(loading)return;loading=true;$('refresh').disabled=true;try{render(await api('/api/dashboard'));$('message').textContent='';$('message').className='statusline muted'}catch(error){$('message').textContent=error.message;$('message').className='statusline error';$('connection').textContent='Disconnected';$('connection').className='connection error'}finally{loading=false;$('refresh').disabled=false}}
$('enabled').addEventListener('change',()=>{$('enabledText').textContent=$('enabled').checked?'Enabled':'Off'});$('refresh').addEventListener('click',refresh);$('save').addEventListener('click',async()=>{const maxWorkers=Number($('maxWorkers').value);if(!Number.isInteger(maxWorkers)||maxWorkers<1||maxWorkers>32){$('message').textContent='Choose a whole number from 1 to 32.';$('message').className='statusline error';return}if(!$('model').value){$('message').textContent='No model is selected.';$('message').className='statusline error';return}$('save').disabled=true;try{const saved=await api('/api/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:$('enabled').checked,maxWorkers,model:$('model').value})});$('message').textContent=saved.message||'Settings saved.';$('message').className='statusline success';await refresh()}catch(error){$('message').textContent=error.message;$('message').className='statusline error'}finally{$('save').disabled=false}});
if(!token){$('message').textContent='Open the temporary dashboard link provided by the router.';$('message').className='statusline error';$('connection').textContent='No access token';$('connection').className='connection error'}else{refresh();setInterval(refresh,5000)}
</script></body></html>
