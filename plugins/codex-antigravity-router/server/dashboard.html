<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antigravity Router</title>
<style>
:root{color-scheme:light dark;font:14px/1.45 system-ui,sans-serif}body{margin:0;padding:18px;background:transparent;color:inherit}.wrap{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.muted{opacity:.68}.card{border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:12px;padding:16px;margin:14px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:12px 0}label{font-weight:600}input,select,button{font:inherit;border:1px solid color-mix(in srgb,currentColor 28%,transparent);border-radius:8px;padding:8px 10px;background:transparent;color:inherit}input[type=number]{width:88px}button{cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb;color:white}.agent{padding:10px 0;border-top:1px solid color-mix(in srgb,currentColor 14%,transparent)}.agent:first-child{border-top:0}.agent strong{display:block}.status{font-size:12px;opacity:.7}.error{color:#dc2626}.toggle{display:flex;gap:9px;align-items:center}
</style></head>
<body><main class="wrap"><div class="top"><div><strong>Antigravity Router</strong><div class="muted">Delegation settings and active workers</div></div><button id="refresh">Refresh</button></div>
<section class="card"><div class="row"><label for="enabled">Delegation</label><label class="toggle"><span id="enabledText">Enabled</span><input id="enabled" type="checkbox" checked></label></div>
<div class="row"><label for="maxWorkers">Maximum workers</label><input id="maxWorkers" type="number" min="1" max="32" step="1" value="4"></div>
<div class="row"><label for="model">Preferred model</label><select id="model"></select></div><div class="row"><button class="primary" id="save">Save settings</button><span class="muted" id="message"></span></div></section>
<section class="card"><div class="top"><strong>Agents</strong><span class="muted" id="agentCount">0</span></div><div id="agents" class="muted" style="margin-top:10px">Loading…</div></section>
<script>
const $=id=>document.getElementById(id);let nextId=1;const pending=new Map();
window.addEventListener('message',event=>{const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);if(m.error)p.reject(new Error(m.error.message||'Router request failed'));else p.resolve(m.result)}else if(m.method==='ui/notifications/tool-result'&&m.params?.structuredContent){show(m.params.structuredContent)}});
function rpc(method,params={}){const id=nextId++;window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error(`Host did not answer ${method}.`))},12000);pending.set(id,{resolve:v=>{clearTimeout(timer);resolve(v)},reject:e=>{clearTimeout(timer);reject(e)}})})}
function notify(method,params={}){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
async function tool(name,args={}){const r=await rpc('tools/call',{name,arguments:args});if(r?.isError)throw new Error(r?.structuredContent?.error||r?.content?.[0]?.text||'Router request failed');return r?.structuredContent||r;}
function show(data){initial=data.settings||{};$('enabled').checked=initial.enabled!==false;$('enabledText').textContent=$('enabled').checked?'Enabled':'Off';$('maxWorkers').value=initial.maxWorkers||4;const models=data.models||[];const selected=initial.model||'gemini-3.8-flash-low';$('model').replaceChildren(...[...new Set([selected,...models])].map(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;return o}));$('model').value=selected;const agents=data.agents||[];$('agentCount').textContent=String(agents.length);$('agents').replaceChildren();if(!agents.length){$('agents').textContent='No active workers';return}for(const a of agents){const row=document.createElement('div');row.className='agent';const title=document.createElement('strong');title.textContent=`${a.name} · ${a.task}`;const info=document.createElement('div');info.className='status';info.textContent=`${a.phase} · ${a.workspace} · ${a.model}`;row.append(title,info);$('agents').append(row)}}
async function refresh(){ $('message').textContent='Loading…';$('message').className='muted';try{show(await tool('antigravity_dashboard_data'));$('message').textContent=''}catch(e){$('message').textContent=e.message;$('message').className='error'}}
(async()=>{try{await rpc('ui/initialize',{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'antigravity-router-dashboard',version:'0.7.0'},appCapabilities:{tools:{},availableDisplayModes:['inline','fullscreen']}});notify('ui/notifications/initialized',{});await refresh();setInterval(refresh,5000)}catch(e){$('message').textContent=e.message;$('message').className='error'}})();
$('enabled').addEventListener('change',()=>{$('enabledText').textContent=$('enabled').checked?'Enabled':'Off'});$('refresh').onclick=refresh;$('save').onclick=async()=>{const n=Number($('maxWorkers').value);if(!Number.isInteger(n)||n<1||n>32){$('message').textContent='Enter a whole number from 1 to 32.';$('message').className='error';return}try{const saved=await tool('antigravity_update_settings',{enabled:$('enabled').checked,maxWorkers:n,model:$('model').value});$('message').textContent=saved.message||'Saved';$('message').className='muted';await refresh()}catch(e){$('message').textContent=e.message;$('message').className='error'}};
</script></main></body></html>
